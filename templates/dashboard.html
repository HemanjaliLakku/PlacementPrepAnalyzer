<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Placement Preparation Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Dashboard</h1>

        <p>Welcome to your Placement Preparation Dashboard!</p>

        <div class="dashboard-cards">

            <div class="card">
                <h2>Preparation Progress</h2>
                <p>0%</p>
            </div>

            <div class="card">
                <h2>Questions Attempted</h2>
                <p>0</p>
            </div>

            <div class="card">
                <h2>Average Score</h2>
                <p>0%</p>
            </div>

            <div class="card">
                <h2>Weak Topics</h2>
                <p>Not analyzed yet</p>
            </div>

        </div>

        <br>

        <button>Start Practice</button>
        <button>View Performance</button>

    </div>

</body>
</html>
