<!DOCTYPE html>
<html>
<head>
    <title>Admin - Add Question</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Admin Panel</h1>
        <p>Add a new placement practice question</p>

        <form method="POST" action="/admin">

            <input type="text" name="subject" placeholder="Subject (e.g. Java)" required>
            <br><br>

            <input type="text" name="topic" placeholder="Topic (e.g. Arrays)" required>
            <br><br>

            <select name="difficulty" required>
                <option value="">Select Difficulty</option>
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
            <br><br>

            <textarea name="question" placeholder="Enter question" required></textarea>
            <br><br>

            <input type="text" name="option_a" placeholder="Option A" required>
            <br><br>

            <input type="text" name="option_b" placeholder="Option B" required>
            <br><br>

            <input type="text" name="option_c" placeholder="Option C" required>
            <br><br>

            <input type="text" name="option_d" placeholder="Option D" required>
            <br><br>

            <select name="correct_answer" required>
                <option value="">Select Correct Answer</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>
            <br><br>

            <textarea name="explanation" placeholder="Enter explanation" required></textarea>
            <br><br>

            <button type="submit">Add Question</button>

        </form>

    </div>

</body>
</html>
